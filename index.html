function routeCard(){return `<section class="card session-route"><h3>Pararbeid · øktrute på 48 minutter</h3><p>Velg ett veiledet forsøk per verksted i stasjon 2–4 og 6. Skriv korte forventninger og forklaringer. Verksted 05 og øvrige oppgaver er fordypning i denne ruten. Alle stasjoner og oppgaver er fortsatt åpne.</p><div class="tablewrap"><table><caption>Prioritering i pararbeidet · omtrentlige tider</caption><thead><tr><th>Minutter</th><th>Stasjon</th><th>Dette gjør dere</th></tr></thead><tbody>${SESSION_ROUTE.map(([n,span,time,title,task])=>`<tr><th>${span}</th><td><button class="btn secondary" data-page="${n}">${n}. ${title}</button></td><td>${task}</td></tr>`).join('')}</tbody></table></div><p>Én styrer, én forklarer. Bytt ved stasjon 4. Stopp ved avtalt tid og ta med et uavklart spørsmål videre. Tidsanslaget må justeres etter første studentutprøving.</p><div class="actions"><button class="btn" data-route="session">Følg øktruten · 48 min</button><button class="btn secondary" data-route="full">Utforsk hele læringsstien · 60–75 min</button></div></section>`;}
function routePrompt(n){if(state.route!=='session')return '';const r=SESSION_ROUTE.find(x=>x[0]===n);return r?`<aside class="transfer route-prompt" aria-label="Prioritet i øktruten"><strong>Øktruten · ${r[2]} minutter</strong><p>${r[4]}</p><p class="small">Øvrige oppgaver og fordypning kan tas senere. <button class="text-button" data-page="0">Se hele ruten</button></p></aside>`:'';}
function legacyExitHTML(){const entries=LEGACY_EXIT_QUESTIONS.filter(([id])=>(state.notes[id]||'').trim());if(!entries.length)return '';return `<details class="legacy-exit"><summary>Bevarte svar fra en tidligere versjon</summary><p class="small">Den tidligere individuelle sluttoppgaven er tatt ut. Svar du allerede har skrevet, er bevart og følger nedlastingen.</p>${entries.map(([id,label])=>`<h4>${escapeHTML(label)}</h4><p class="student-note">${escapeHTML(state.notes[id])}</p>`).join('')}</details>`;}

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}const msg=storageOK?'Fremdrift og notater lagres bare i denne nettleseren.':'Lagring er ikke tilgjengelig. Last ned feltboken før du lukker filen.';$('#saveStatus').textContent=msg;const warning=$('#storageWarning');if(warning){warning.hidden=storageOK;warning.textContent=msg;}}
function done(id){return !!state.answers[id]?.correct}
function updateProgress(){const tasks=state.route==='session'?SESSION_TASKS:groups.flat(),n=tasks.filter(done).length;$('#progressText').textContent=`${n} av ${tasks.length} oppgaver i ${state.route==='session'?'øktruten':'hele læringsstien'} løst`;$('#progressFill').style.width=(n/tasks.length*100)+'%';$('.progress').setAttribute('aria-valuenow',n);$('.progress').setAttribute('aria-valuemax',tasks.length);$('#nav').innerHTML=titles.map((t,i)=>`<button data-page="${i}" aria-label="${i>0&&i<8?'Gå til stasjon '+i+' – ':'Gå til '}${escapeHTML(t)}" class="${i===state.page?'active':''}" ${i===state.page?'aria-current="step"':''}><span class="navnum">${groups[i].length&&groups[i].every(done)?'✓':i===0?'•':i}</span><span class="navlabel">${t}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.page))}
function photo(key,alt,cls=''){return `<figure class="photo ${cls}"><img src="${photos[key]}" alt="${alt}"><figcaption class="photocredit">Foto: Bjørn Aksel Bjerke</figcaption></figure>`}
function head(n,title,lead,time){return `<div class="stephead"><p class="eyebrow">Stasjon ${n} av 7 · ${state.route==='session'?'øktrute ca. '+SESSION_ROUTE.find(r=>r[0]===n)[2]+' min':'foreløpig ca. '+time+' min for hele kjernen'}</p><h1>${title}</h1><p class="lead">${lead}</p></div>${routePrompt(n)}`}
function math(body){return `<details><summary>Vis meg matematikken (valgfritt)</summary>${body}</details>`}

migration:{page:5,type:'number',title:'Hvor mange dyr er det i bestanden i område B etter ett år?',prompt:'Bestanden i område B starter med 100 dyr. Der fødes 12, 20 dør og ingen vandrer ut. Fra A kommer 15 dyr inn.',answer:107,unit:'dyr',hint:'Uten innvandring ville B hatt 92 dyr. Legg til de 15 som kommer inn.',good:'107 dyr. Bestanden i område B vokser, selv om lokal reproduksjon ikke oppveier dødsfallene. Veksten kan derfor skjule avhengighet av innvandring.',feedback:v=>v===92?'92 er riktig uten innvandring. Men 15 dyr kommer fra A.':'Bruk regnskapet: 100 + 12 − 20 + 15 = ? Husk at innvandring er en tilførsel til B.'},
balance:{page:1,title:'Den faktiske bestanden er 100 dyr ved begge tellinger. Vandringen er ukjent. Hva kan vi slutte?',options:['Fødsler og innvandring balanserte dødsfall og utvandring samlet.','Antall fødsler var lik antall dødsfall; ellers ville bestanden endret seg.','Uendret totalantall viser at bestandens aldersfordeling var stabil.'],correct:0,hint:'Hvilke kombinasjoner av de fire prosessene kan gi netto endring lik null?',feedback:['Ja. B + I = D + E. Det kan samtidig være stor utskifting og en endret aldersfordeling.','Dette krever netto vandring lik null, noe vi ikke vet. Innvandring kan oppveie et lokalt underskudd.','Unge dyr kan erstatte voksne eller omvendt. Samme totalantall sier ikke at sammensetningen er bevart.']},
lambda:{page:2,title:'To bestander har 100 og 200 dyr. Begge har λ = 0,95 i ett år, uten eget jaktuttak. Hvilket par passer modellen?',options:['95 og 195 dyr.','105 og 210 dyr.','95 og 190 dyr.'],correct:2,hint:'Gang hvert startantall med 0,95. Samme prosent er ikke samme antall.',feedback:['Da er et tap på fem dyr brukt i begge bestandene. λ gir 5 % nedgang, som er ti dyr når starten er 200.','Dette er 5 % vekst, altså λ = 1,05. En faktor mindre enn én gir nedgang.','Riktig. Begge mister 5 %, men den største mister dobbelt så mange individer.']},

density:{page:3,title:'Hvilket funn gir sterkest støtte for negativ tetthetsavhengighet i kalveoverlevelsen?',options:['Det dør flere kalver i en stor bestand enn i en liten, men andelen døde er lik.','Kalveoverlevelsen er lavere i et tett område som også har langt strengere vinter.','Andelen kalver som overlever, avtar med tetthet på tvers av år og områder med sammenlignbare miljøforhold.'],correct:2,hint:'Se etter endring i en rate, og vurder om en annen faktor kan forklare sammenhengen.',feedback:['Antall døde kan øke bare fordi det finnes flere kalver. En uendret andel viser ikke lavere overlevelse per individ.','Sammenhengen er relevant, men vinterforskjellen kan forklare den. Vi kan ikke skille tetthets- og miljøeffekt med disse opplysningene alene.','Ja. Her er både rate og miljøsammenligning med. Dette støtter tetthetsavhengighet; selve mekanismen, som matkonkurranse, må fortsatt undersøkes.']},

pit:{page:6,title:'Rådyrbestanden er lav og stabil, og en type III-respons hos gaupe er anslått. Kan vi konkludere med en predasjonsfelle?',options:['Ja, lav stabil bestand viser at predasjon hindrer vekst mot et høyere nivå.','Nei, vi må undersøke tilvekst, samlet predasjonsdødelighet og andre mekanismer før vi vurderer om predasjon hindrer vekst til et høyere nivå.','Ja, type III viser både byttedyrenes tilvekst og hvor bestanden stabiliseres.'],correct:1,hint:'Hva vet en konsumkurve om reproduksjon, andre tap og utvikling etter endret predasjonstrykk?',feedback:['Et lavt stabilt nivå kan ha flere forklaringer. Det dokumenterer ikke alene at bestanden holdes i en felle.','Riktig. Undersøk hele bestandsregnskapet og hvordan det varierer med tetthet. Respons ved redusert predasjonstrykk kan hjelpe, men vekst alene beviser ikke alternative stabile tilstander.','Type III viser konsum per rovdyr ved ulik byttedyrtetthet. Den gir verken byttedyrtilvekst eller hele bestandens likevekter alene.']},

regulation:{page:3,title:'Et jaktuttak økes når bestanden ligger over målet, og reduseres når den ligger under. Hva er nøkkelen til regulering?',options:['At uttaket alltid er like stort.','At tiltaket gir negativ tilbakekobling fra bestandsstørrelse til vekst.','At målet nødvendigvis er lik økologisk bæreevne.'],correct:1,hint:'Se etter en mekanisme som motvirker avvik fra et nivå.',feedback:['Et fast uttak gir ikke i seg selv slik stabiliserende tilbakekobling. Virkningen avhenger av hele systemet.','Riktig. En passende respons kan motvirke avvik. Forsinkede eller usikre bestandstall kan likevel gjøre styringen vanskelig.','Et forvaltningsmål er et valgt nivå og kan ligge under økologisk bæreevne. De to begrepene må holdes fra hverandre.']},
age:{page:4,title:'To bestander har 100 dyr hver. Hvilket datagrunnlag gjør prognosen best egnet til å fange opp forskjeller i alders- og kjønnssammensetning?',options:['Fjorårets samlede vekstfaktor, brukt på hele bestanden i hvert område.','Antall dyr i hver alders- og kjønnsgruppe, koblet til gruppenes overlevelse og reproduksjon.','Gjennomsnittlig kroppsvekt og beitetilgang, brukt til å anslå én vekstrate for hver bestand.'],correct:1,hint:'Hvilket datagrunnlag lar deg beregne bidragene fra unge, voksne, hunner og hanner hver for seg?',feedback:['Fjorårets vekstfaktor kan være nyttig, men samler alle gruppene i ett tall. Den kan skjule at sammensetningen har endret seg, eller at gruppene har ulike vitale rater.','Ja. Når antallet i hver gruppe kobles til gruppens vitale rater, kan prognosen fange opp at to like store bestander har ulik sammensetning og dermed ulik forventet utvikling.','Kroppsvekt og beitetilgang er relevante, men én samlet vekstrate viser ikke direkte hvordan alders- og kjønnsgruppene bidrar forskjellig. Gruppespesifikke data svarer mer direkte på spørsmålet.']},
cohort:{page:4,title:'Et dårlig beiteår gir små kalver. Flere år senere får denne årsklassen færre avkom. Hva illustrerer det?',options:['En kohorteffekt som kan gi en forsinket virkning på bestandsveksten.','At alle miljøeffekter forsvinner ved neste årsskifte.','At årsklassen nødvendigvis har uendret kvalitet, bare færre individer.'],correct:0,hint:'En kohort er individer født i samme periode. Tidlige forhold kan påvirke dem senere.',feedback:['Riktig. Fødselsåret kan påvirke både antall individer og senere livshistorie. Hvis den dårlige starten skyldtes høy tetthet, kan dette gi forsinket tetthetsavhengighet.','Tidlige levevilkår kan ha følger lenge etter at selve miljøhendelsen er over.','En kohort kan ha både en numerisk effekt og en kvalitetseffekt. Her beskrives en kvalitetseffekt på senere reproduksjon.']},
migration:{page:5,type:'number',title:'Hvor mange dyr er det i bestanden i område B etter ett år?',prompt:'Bestanden i område B starter med 100 dyr. Der fødes 12, 20 dør og ingen vandrer ut. Fra A kommer 15 dyr inn.',answer:107,unit:'dyr',hint:'Uten innvandring ville B hatt 92 dyr. Legg til de 15 som kommer inn.',good:'107 dyr. Bestanden i område B vokser, selv om lokal reproduksjon ikke oppveier dødsfallene. Veksten kan derfor skjule avhengighet av innvandring.',feedback:v=>v===92?'92 er riktig uten innvandring. Men 15 dyr kommer fra A.':'Bruk regnskapet: 100 + 12 − 20 + 15 = ? Husk at innvandring er en tilførsel til B.'},
dispersal:{page:5,title:'En medstudent sier: «Høy tetthet gir alltid mer utvandring.» Hva svarer du?',options:['Enig. Matkonkurranse er den eneste mekanismen.','Ikke alltid. Partnertilgang, sosiale forhold og kondisjon kan endre mønsteret.','Utvandring kan aldri påvirke bestandsutviklingen.'],correct:1,hint:'Matkonkurranse er én mulig drivkraft. Hvordan kan partnertilgang og sosiale forhold trekke i en annen retning?',feedback:['Matkonkurranse er én mekanisme. Andre mekanismer kan gi motsatt mønster.','Ja. Tetthet kan virke gjennom flere mekanismer. God tilgang på partnere kan for eksempel bidra til at dyr blir værende, selv om matkonkurransen øker. Mekanisme og kontekst må undersøkes.','Netto vandring endrer antallet direkte og kan også endre kjønns- og aldersfordelingen.']},
response:{page:6,title:'Flere rådyr gjør at hver gaupe tar flere rådyr per måned, mens antall gauper er uendret. Hvilken respons beskrives?',options:['Funksjonell respons.','Numerisk respons.','Bare utvandring.'],correct:0,hint:'Spør: endres antall rovdyr, eller uttaket per rovdyr?',feedback:['Ja. Funksjonell respons er sammenhengen mellom byttedyrtetthet og konsum per rovdyr per tidsenhet. Numerisk respons handler om antall eller tetthet av rovdyr.','Da måtte antall eller tetthet av gauper ha endret seg. Her endres uttaket per gaupe.','Eksempelet beskriver konsum per rovdyr, ikke flytting mellom bestander.']},
pit:{page:6,title:'Er en type III-kurve alene bevis for at rådyrene blir holdt i en predasjonsfelle?',options:['Ja. Kurveformen bestemmer alltid hele bestandsutviklingen.','Nei. Vi må også kjenne byttedyrenes tilvekst, antall rovdyr og andre tap.','Ja, så lenge det finnes minst ett rovdyr.'],correct:1,hint:'Bestanden endres av det samlede regnskapet. Kurven viser bare én del av det.',feedback:['Kurveformen alene sier ikke hvor totaluttaket krysser tilveksten, eller om en likevekt er stabil.','Riktig. En lav stabil likevekt kan oppstå under bestemte forhold. Type III og bytte av byttedyr kan inngå i slike forløp, men er ingen garanti for en felle.','Ett rovdyr sier lite uten informasjon om konsum, tilvekst, andre dødsårsaker og innvandring.']},
decision:{page:7,title:'Hvilket råd er best begrunnet i feltdataene over?',options:['Behold eller øk uttaket, fordi siste telling er høyere.','Vurder et mer forsiktig uttak og styrk overvåkingen av kalver, voksne hunndyr og vandring.','Stans all forvaltning til vi kjenner det nøyaktige antallet.'],correct:1,hint:'Se på både kalveandelen, telleusikkerheten og målet om å unngå videre nedgang.',feedback:['Telleintervallene overlapper, og lavere kalvetall kan varsle svekket rekruttering. Ett høyere punktestimat er et svakt grunnlag for økt uttak.','Godt begrunnet. Rådet kobler tegn på svak rekruttering med usikkerhet og behovet for bedre data. En konkret kvote krever en mer fullstendig vurdering.','Usikkerhet krever tydelige antakelser og oppfølging. Det er fortsatt mulig å velge forsiktige, justerbare tiltak.']},
uncertainty:{page:7,title:'Neste år blir bestanden lavere enn prognosen. Hva gjør en lærende forvaltning?',options:['Øker uttaket for å få modellen til å passe.','Undersøker hvilke antakelser som sviktet, oppdaterer modellen og vurderer tiltaket på nytt.','Forkaster alle framtidige tellinger.'],correct:1,hint:'En prognose er en hypotese som kan sammenholdes med nye observasjoner.',feedback:['Uttak endrer bestanden, ikke sannheten i den opprinnelige prognosen. Undersøk avviket før du endrer tiltaket.','Ja. Sammenlign observasjon og forventning, vurder tellefeil og biologiske prosesser, og juster både kunnskap og handling.','Nye tellinger er nettopp det som gjør det mulig å lære. Vurder metode og usikkerhet i stedet for å slutte å samle data.']}

for(const [id,a] of Object.entries(state.answers)){

  a.lastCorrect=q.type==='number'?v===q.answer:v===q.correct;

}
function quiz(id){const q=Q[id],a=state.answers[id];return `<section class="question" id="q-${id}" aria-label="Øvingsoppgave"><p class="kicker">Din tur ${done(id)?'<span class="donepill">· løst ✓</span>':''}</p><fieldset><legend>${q.title}</legend>${q.prompt?`<p>${q.prompt}</p>`:''}${q.type==='number'?`<label class="sr-only" for="ans-${id}">Antall ${q.unit}</label><div class="inputrow"><input id="ans-${id}" type="number" inputmode="numeric" min="0" step="1" placeholder="Ditt svar" value="${a?.value??''}"><span>${q.unit}</span></div>`:`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}" ${a?.value===i?'checked':''}><span>${o}</span></label>`).join('')}</div>`}</fieldset><div class="actions"><button class="btn" data-check="${id}">Sjekk svaret</button><button class="btn secondary" data-hint="${id}" aria-expanded="false" aria-controls="hint-${id}">Gi meg et hint</button></div><div class="hint" id="hint-${id}" hidden>${q.hint}</div><div class="feedback ${a?.lastCorrect?'good':''}" id="fb-${id}" role="status">${a?.text||''}</div></section>`}
function note(id,label,placeholder){return `<label for="note-${id}"><strong>${label}</strong></label><p class="small">Notatet lagres i feltboken. Stikkord eller en kort begrunnelse er nok.</p><textarea id="note-${id}" data-note="${id}" placeholder="${placeholder}">${escapeHTML(state.notes[id]||'')}</textarea>`}

const ANSWER_SUPPORT={
  'model-growth':{summary:'Se svarforslag til kjerneforsøket',intro:'Gjelder 5 % årlig vekst fra 100 dyr, ved 10 og 20 år. Andre innstillinger kan gi andre tall.',body:'<p><strong>Observasjon:</strong> Bestanden er omtrent 163 dyr etter 10 år og 265 etter 20 år. De første ti årene kommer det til omtrent 63 dyr, de neste ti omtrent 102.</p><p><strong>Forklaring:</strong> Samme prosent regnes av en større bestand etter hvert. Derfor øker det årlige tillegget i antall dyr. Hvis du forventet like mange nye dyr i begge periodene, er dette forskjellen mellom fast prosent og fast antall.</p><p><strong>Modellens grenser:</strong> Endringer i beite, miljø, overlevelse, reproduksjon eller vandring kan endre vekstfaktoren. Kurven viser hva som følger av konstant vekstfaktor, ikke hva som sikkert vil skje.</p>'},
  'model-density':{summary:'Se svarforslag til kjerneforsøket',intro:'Gjelder startbestand 250 dyr, uten vintertap, med K = 250 og K = 150.',body:'<p><strong>Observasjon:</strong> Ved K = 250 holder bestanden seg på 250. Ved K = 150 går den ned og nærmer seg 150 dyr.</p><p><strong>Forklaring:</strong> Når startbestanden er lik K, er modellens netto vekst null. Når startbestanden ligger over K, er veksten negativ. Samme antall dyr får derfor ulik utvikling under ulike ressursforhold. Sammenlign retningen med det du forutsa.</p><p><strong>Modellens grenser:</strong> K holdes fast i hvert scenario. Modellen sier ikke hvordan vær, aldersfordeling og vandring faktisk virker i Fjellvik. K er heller ikke kommunens valgte bestandsmål.</p>'},
  'model-age':{summary:'Se svarforslag til kjerneforsøket',intro:'Gjelder sammenligningen av 30 voksne + 70 hunnkalver og 70 voksne + 30 hunnkalver, med de faste ratene i modellen.',body:'<p><strong>Observasjon:</strong> Med 30 voksne blir 69 hunndyr fra startbestanden igjen, og 9 nye hunnkalver kommer til: 78 ved neste telling. Med 70 voksne blir det 81 overlevende og 21 nye hunnkalver: 102 til sammen.</p><p><strong>Forklaring:</strong> Voksne har høyere overlevelse enn kalver i modellen, og bare voksne ved start bidrar med nye kalver. Begge deler forklarer forskjellen. Hvis du forutsa at bestandene ville bli like store, viser forsøket hvorfor sammensetning betyr noe.</p><p><strong>Modellens grenser:</strong> Dette er en ettårsberegning med faste rater, uten vandring og uten fullstendige aldersoverganger gjennom flere år. Resultatet betyr ikke at høyest mulig voksenandel alltid er best.</p>'},
  'model-pred':{summary:'Se svarforslag til kjerneforsøket',intro:'Gjelder 100 byttedyr, først 3 rovdyr, deretter 6 rovdyr med type II. Resultatene gjelder én måned i øvingsmodellen.',body:'<p><strong>Observasjon:</strong> Med 3 rovdyr gir type II 4 byttedyr per rovdyr, 12 totalt og 12 % tatt. Type III gir 2,4 per rovdyr, 7,2 totalt og 7,2 % tatt. Når antall rovdyr økes fra 3 til 6 med type II, blir totaluttaket 24 og andelen 24 %. Konsumet per rovdyr er fortsatt 4.</p><p><strong>Forklaring:</strong> De to kurvene gir ulikt konsum ved 100 byttedyr. I denne modellen påvirker ikke rovdyrantallet konsumet per rovdyr; det endrer hvor mange som spiser. Derfor dobles totaluttaket når rovdyrantallet dobles, mens kurven ligger fast.</p><p><strong>Numerisk respons:</strong> Glideren gir ulike antall rovdyr som forutsetning. Den beregner ikke hvordan rovdyrantallet reagerer på byttedyrtilgangen over tid.</p><p><strong>Valgfri sammenligning:</strong> Ved 400 byttedyr og 3 rovdyr gir type II 24 totalt (6 %) og type III 28,8 totalt (7,2 %). Rangeringen er altså ikke lik ved alle tettheter.</p><p><strong>Modellens grenser:</strong> Kurvene er teoretiske. Modellen følger ikke byttedyrtilvekst, endring i rovdyrantall eller uttømming gjennom måneden. Den dokumenterer ingen predasjonsfelle.</p>'},
  'model-quota':{summary:'Se svarforslag til kjerneforsøket',intro:'Gjelder startbestand 240 dyr og fem år med fast uttak på henholdsvis 30 og 15 dyr.',body:'<p><strong>Observasjon:</strong> Med uttak 30 er bestanden etter fem år omtrent 50, 203 og 374 dyr ved λ = 0,95, 1,10 og 1,20. Med uttak 15 blir det omtrent 118, 295 og 486 dyr. Lavere uttak gir flere dyr i alle tre scenarioene, men bestanden går fortsatt ned ved λ = 0,95.</p><p><strong>Forklaring:</strong> Ved λ = 0,95 går bestanden ned allerede før jaktuttaket trekkes fra. Mindre jakt demper tapet, men gir ikke nødvendigvis vekst. Derfor er det mulig at prediksjonen om flere dyr stemmer, samtidig som en forventning om vekst ikke stemmer.</p><p><strong>Modellens grenser:</strong> Scenarioene har faste vekstfaktorer og ingen beregnede sannsynligheter. Tallene viser følger av valgte antakelser, ikke utryddelsesrisiko eller en anbefalt kvote for Fjellvik.</p>'},
  'fjellvik-1':{summary:'Se et svarforslag',intro:'Dette er ett mulig resonnement. Du kan prioritere andre data hvis du begrunner hvorfor.',body:'<p>Jeg vil undersøke fødsler, dødsfall – inkludert jakt – og inn- og utvandring. En økning i den faktiske bestanden kan skyldes flere fødsler, færre dødsfall eller netto innvandring. Bestandsanslag alene viser ikke hvilket bidrag som har endret seg. I tillegg må vi vite om tellemetode og oppdagbarhet er sammenlignbare mellom årene.</p>'},
  'fjellvik-2':{summary:'Se et svarforslag',intro:'Se etter om begrunnelsen din skiller en observert periode fra en antakelse om framtiden.',body:'<p>Veksten de siste årene beskriver denne perioden. Den viser ikke at beite, vær, aldersfordeling og andre forhold vil være uendret framover. Jeg ville derfor brukt konstant vekstfaktor som ett scenario for Fjellvik og undersøkt hvilke nye data som støtter eller svekker antakelsen.</p>'},
  'fjellvik-3':{summary:'Se et svarforslag',intro:'Flere typer data kan være relevante. Ingen enkelt indikator avgjør årsaken alene.',body:'<p>Jeg vil sammenligne tetthet, beitetilgang, kondisjon eller kroppsvekt, værforhold og kalveoverlevelse over flere år og områder. Dårligere overlevelse ved høy tetthet under ellers sammenlignbare forhold støtter en tetthetseffekt. Samvariasjon med streng vinter kan støtte en væreffekt. De kan også virke sammen, så vi må vurdere dem samlet og kontrollere observasjonsforholdene.</p>'},
  'fjellvik-4':{summary:'Se et svarforslag',intro:'Knytt sammensetningen av bestanden til reproduksjon, og ta med en viktig forutsetning.',body:'<p>Færre voksne hunndyr kan bety færre individer som får kalver, selv om totalantallet er uendret. Med ellers like rater kan rekrutteringen derfor bli lavere. Jeg ville undersøkt alders- og kjønnsfordelingen, kalver per voksen hunn og overlevelsen. Ettårsmodellen viser mekanismen, men dens rater er ikke målt i Fjellvik.</p>'},
  'fjellvik-5':{summary:'Se et svarforslag',intro:'Skillet mellom lokal demografi og netto vandring er hovedpoenget.',body:'<p>Ja. Innvandring kan oppveie at lokal reproduksjon ikke erstatter tapene. Jeg trenger data om fødsler, dødsfall og bevegelse mellom Fjellvik og naboområdene, helst over flere år. Merkede dyr eller andre bevegelsesdata kan bidra til å anslå vandringen. Høyt lokalt antall alene dokumenterer ikke gode lokale levevilkår.</p>'},
  'fjellvik-6':{summary:'Se et svarforslag',intro:'Et godt svar undersøker både predasjon og andre mulige forklaringer.',body:'<p>Jeg vil undersøke antall gauper og konsum per gaupe, samt rådyrenes reproduksjon, overlevelse, dødsårsaker og vandring. Observasjonsmetodene må også vurderes. At gaupe er registrert, forteller ikke hvor stor del av tapene den står for, eller om predasjon forklarer bestandsendringen.</p>'},
  pit:{summary:'Se et svarforslag',intro:'Spørsmålet har flere relevante svar. Sammenlign hvilke data du vil samle og hvilken forklaring de kan undersøke.',body:'<p>Jeg vil måle byttedyrenes tilvekst og samlede dødelighet, med kunnskap om predasjon, andre dødsårsaker og vandring. Data ved ulike bestandsnivåer og over flere år er viktig. Utviklingen under og etter redusert predasjonstrykk kan bidra til å undersøke om predasjon hindrer vekst mot et høyere nivå. Lavt antall eller vekst etter en reduksjon er ikke alene bevis for en predasjonsfelle.</p>'},
  detection:{summary:'Se et svarforslag',intro:'Hovedpoenget kan uttrykkes på flere måter.',body:'<p>Nei. Flere observerte dyr kan skyldes høyere oppdagbarhet, uten at bestanden har vokst. I demonstrasjonen øker det forventede antallet observerte fra 120 til 160 når p går fra 60 % til 80 %, mens bestanden fortsatt er 200. For en virkelig bestand trenger vi kunnskap om metode, innsats, oppdagbarhet og usikkerhet før vi tolker endringen.</p>'},
  advice:{summary:'Se et eksempel på et begrunnet notat',intro:'Dette er ett eksempel med en betinget strategi, ikke en kvotefasit. Redusert eller midlertidig uendret uttak kan også forsvares med en tydelig begrunnelse; se sammenligningen av strategier nedenfor.',body:'<p><strong>1 · Observasjoner:</strong> Bestandsanslaget har økt fra 220 til 240 dyr, mens observerte kalver per voksen hunn har gått ned fra 0,65 til 0,40. Fjorårets uttak var 30 dyr.</p><p><strong>2 · Usikkerhet:</strong> Anslagene har illustrativ usikkerhet på ±15 dyr, og vi kjenner ikke håndteringen av oppdagbarhet, vandring eller utvalget bak kalvetallene. Årsaken til endringene er derfor usikker.</p><p><strong>3 · Mekanismer:</strong> Lavere reproduksjon eller kalveoverlevelse kan bidra til færre kalver per hunn; endrede observasjonsforhold eller et annet utvalg kan også gi dette mønsteret. Et høyere bestandsanslag kan blant annet henge sammen med innvandring.</p><p><strong>4 · Anbefaling:</strong> Jeg anbefaler en betinget strategi med ny vurdering før jakt. Videre uttak på 30 dyr bør forutsette at oppdaterte data støtter tilstrekkelig tilvekst, og at kommunen aksepterer den gjenværende usikkerheten; ved tegn på svekket tilvekst anbefaler jeg lavere uttak. Målet er å opprettholde bestanden og jaktmulighetene over tid. Strategien krever en avtalt beslutningsregel og data i tide; et for høyt anslag på tilveksten kan gi for stort uttak.</p><p><strong>5 · Nye data:</strong> Jeg vil prioritere standardiserte bestandsundersøkelser som håndterer oppdagbarhet, data om kalve- og hunnoverlevelse og vandring. Disse bør foreligge før neste kvotebeslutning.</p><p class="small">Når en slik strategi skal brukes i praksis, må «tilstrekkelig tilvekst», akseptabel risiko og regelen for å endre uttaket konkretiseres. Øvingsdataene er ikke nok til å tallfeste dette.</p>'},
  reflection:{summary:'Se et eksempel på refleksjon',intro:'Dette spørsmålet har ingen fasit. Skriv hva du selv har oppdaget; eksempelet viser bare en mulig måte å begrunne det på.',body:'<p>Før tenkte jeg at flere observerte dyr betydde en større bestand. Nå ser jeg at også oppdagbarhet kan endre tellingen. I en virkelig bestand ville jeg derfor først undersøkt om metode og observasjonsforhold var sammenlignbare, før jeg brukte tellingene som grunnlag for et jaktuttak.</p>'}
};
function answerSupport(key){const support=ANSWER_SUPPORT[key];return `<details class="answer-support" data-answer-support="${key}"><summary>${support.summary}</summary><p class="small">${support.intro}</p>${support.body}<p class="small">Hvilke poenger har du med? Er det noe du vil presisere i din egen forklaring?</p></details>`}
function transfer(station){const id='fjellvik-'+station;return `<section class="transfer transfer-note" aria-labelledby="fjellvik-heading-${station}"><h3 id="fjellvik-heading-${station}">Til Fjellvik</h3><p class="small">Noter stikkord eller én setning. Notatet lagres mens du skriver, og vises igjen ved sluttoppgaven og i feltboken.</p>${shortField('note-'+id,FJELLVIK_PROMPTS[station],state.notes[id],`data-note="${id}"`)}${answerSupport(id)}</section>`}
function fjellvikNotes(){
  const written=Object.keys(FJELLVIK_PROMPTS).filter(n=>(state.notes['fjellvik-'+n]||'').trim());
  if(!written.length)return '<p>Her samles det du skriver i «Til Fjellvik» på stasjon 1–6. Du har ikke skrevet noen slike notater ennå.</p>';
  return written.map(n=>`<div class="fjellvik-record"><h4>Stasjon ${n} · ${escapeHTML(titles[n])}</h4><p class="small">${escapeHTML(FJELLVIK_PROMPTS[n])}</p><p class="student-note">${escapeHTML(state.notes['fjellvik-'+n])}</p><button class="btn secondary" data-page="${n}" aria-label="Gå til stasjon ${n} for å endre Fjellvik-notatet">Endre notatet på stasjon ${n}</button></div>`).join('');
}

const NOTE_LABELS={
  ...Object.fromEntries(LEGACY_EXIT_QUESTIONS),
  ...Object.fromEntries(Object.entries(FJELLVIK_PROMPTS).map(([n,q])=>['fjellvik-'+n,'Stasjon '+n+' · Til Fjellvik: '+q])),
  pit:'Stasjon 6 · Hvilke data trengs for å undersøke en predasjonsfelle?',
  detection:'Stasjon 7 · Kan flere observerte dyr dokumentere bestandsvekst?',
  'advice-observations':'1. Hva vet vi fra observasjonene?',
  'advice-uncertainty':'2. Hva er usikkert?',
  'advice-mechanisms':'3. Hvilke biologiske mekanismer kan forklare utviklingen?',
  'advice-action':'4. Hvilket tiltak anbefaler du, og hvorfor?',
  'advice-data':'5. Hvilke nye data ville du samlet inn før neste beslutning?',
  advice:'Tidligere forvaltningsnotat (bevart fra forrige versjon)',
  reflection:'Din viktigste oppdagelse'
};
const ADVICE_KEYS=['advice-observations','advice-uncertainty','advice-mechanisms','advice-action','advice-data'];
let currentModels={};
let modelRenderers=[];
function newTrial(id){
  const list=state.experiments[id]||(state.experiments[id]=[]);
  const trial={id:id+'-'+(list.length+1),station:MODEL_META[id].station,number:list.length+1,prediction:'',observation:'',explanation:'',limits:'',snapshots:[]};
  list.push(trial); return trial;
}
function activeTrial(id){return state.experiments[id]?.at(-1)||newTrial(id)}
function trialHasWork(t){return !!(t.prediction||t.observation||t.explanation||t.limits||t.snapshots.length)}
function shortField(id,label,value,attrs=''){
  return `<div class="short-field"><label for="${id}">${label}</label><textarea class="short-note" id="${id}" rows="2" ${attrs}>${escapeHTML(value||'')}</textarea></div>`;
}
function trialField(id,key,label){const t=activeTrial(id),locked=key==='prediction'&&t.snapshots.length>0;return shortField(`trial-${id}-${key}`,label,t[key],`data-trial="${id}" data-field="${key}" ${locked?'readonly aria-describedby="prediction-lock-'+id+'"':''}`)}
function trialStart(id){const m=MODEL_META[id],t=activeTrial(id);return `<div class="learning-cycle"><p class="kicker">Kjerneforsøk ${t.number} · Forutsi → Endre → Observer → Forklar</p><p class="small">Stikkord eller én kort setning per felt er nok. Forutsigelsen trenger ikke være riktig. Etter forsøket kan du åpne et svarforslag og sammenligne med din egen forklaring.</p>${trialField(id,'prediction','1 · Forutsi: '+m.prediction)}<p id="prediction-lock-${id}" class="small" ${t.snapshots.length?'':'hidden'}>Prediksjonen er bevart sammen med forsøket. Start et nytt forsøk hvis du vil undersøke en ny idé.</p><p><strong>2 · Endre:</strong> ${m.guide} <span class="small save-location">(Knappen «Ta vare på dette resultatet» ligger under modellen og resultatfeltene i dette verkstedet.)</span></p>${m.presets.length?`<div class="actions">${m.presets.map((p,i)=>`<button class="btn secondary" data-model-preset="${id}" data-preset-index="${i}">${p[0]}</button>`).join('')}</div>`:''}</div>`}
function trialEnd(id){return `<div class="learning-cycle cycle-end"><p class="small">Ta vare på hvert resultat du vil sammenligne. Innstillinger og nøkkeltall legges i feltboken; senere justeringer endrer dem ikke.</p><div class="actions"><button class="btn secondary" data-snapshot="${id}">Ta vare på dette resultatet</button></div><p class="small" id="trial-status-${id}" role="status"></p><div id="snapshots-${id}"></div>${trialField(id,'observation','3 · Observer: Hva er den viktigste forskjellen mellom resultatene?')}${trialField(id,'explanation','4 · Forklar: '+MODEL_META[id].explain)}<details><summary>Valgfri fordypning · Hva kan modellen ikke si?</summary>${trialField(id,'limits','Hvilken utelatt prosess eller antakelse kan endre konklusjonen?')}</details>${answerSupport('model-'+id)}<div class="actions" style="margin-top:16px"><button class="btn secondary" data-new-trial="${id}">Start et nytt forsøk</button></div><p class="small" style="margin-top:10px">Notatene lagres mens du skriver. Tidligere forsøk blir stående i feltboken.</p></div>`}
function pairsHTML(rows){return `<dl class="data-pairs">${rows.map(([k,v])=>`<div><dt>${escapeHTML(k)}</dt><dd>${escapeHTML(v)}</dd></div>`).join('')}</dl>`}
function snapshotsHTML(t){return t.snapshots.map((s,i)=>`<details><summary>Resultat ${i+1} · ${escapeHTML(s.short)}</summary>${pairsHTML(s.params)}${pairsHTML(s.results)}</details>`).join('')}
function renderSnapshots(id){const box=$('#snapshots-'+id);if(box)box.innerHTML=snapshotsHTML(activeTrial(id))}
function captureResult(id){
  const model=currentModels[id];if(!model)return;
  const t=activeTrial(id);
  t.snapshots.push(JSON.parse(JSON.stringify({...model,prediction:t.prediction})));
  const field=$('#trial-'+id+'-prediction');field.readOnly=true;field.setAttribute('aria-describedby','prediction-lock-'+id);
  $('#prediction-lock-'+id).hidden=false;
  save();renderSnapshots(id);
  $('#trial-status-'+id).textContent=`Resultat ${t.snapshots.length} er lagt i forsøk ${t.number}. Du kan endre modellen og ta vare på et nytt resultat.`;
}
function rememberModel(id,short,params,results){currentModels[id]={short,params,results};const s=$('#trial-status-'+id);if(s)s.textContent=activeTrial(id).snapshots.length?'Modellen viser gjeldende innstillinger. Resultater du allerede har tatt vare på, er uendret.':'Ingen resultater er tatt vare på i dette forsøket ennå.'}

function adviceHTML(){return ADVICE_KEYS.map(k=>`<h4>${NOTE_LABELS[k]}</h4><p class="student-note">${escapeHTML(state.notes[k]||'(Ikke skrevet)')}</p>`).join('')+(state.notes.advice?`<details><summary>Tidligere forvaltningsnotat · bevart</summary><p class="student-note">${escapeHTML(state.notes.advice)}</p></details>`:'')}
function fieldbookTrials(){let out='';for(const [id,m] of Object.entries(MODEL_META)){const list=(state.experiments[id]||[]).filter(trialHasWork);if(!list.length)continue;out+=`<h3>Stasjon ${m.station} · Verksted ${m.number}</h3>${list.map(t=>`<details class="trial-record"><summary>Forsøk ${t.number} · ${m.title} · ${t.snapshots.length} resultater</summary><p class="student-note"><strong>Forutsi:</strong> ${escapeHTML(t.prediction||'(Ikke skrevet)')}</p>${snapshotsHTML(t)}<p class="student-note"><strong>Observer:</strong> ${escapeHTML(t.observation||'(Ikke skrevet)')}</p><p class="student-note"><strong>Forklar:</strong> ${escapeHTML(t.explanation||'(Ikke skrevet)')}</p>${t.limits?`<p class="student-note"><strong>Modellens grenser:</strong> ${escapeHTML(t.limits)}</p>`:''}</details>`).join('')}`;}return out||'<p>Ingen modellforsøk er dokumentert ennå. Noter en prediksjon i et verksted og ta vare på resultatene du vil sammenligne.</p>'}
function legacyHTML(){return state.legacyAnswers.length?`<details><summary>Tidligere kjerneoppgaver · ${state.legacyAnswers.length} svar bevart</summary><p class="small">Disse oppgavene er revidert. Svarene dine er beholdt her, men teller ikke som løsninger på de nye spørsmålene.</p>${state.legacyAnswers.map(a=>`<p><strong>${escapeHTML(a.title)}</strong><br>Svar: ${escapeHTML(a.response)}<br>Tilbakemelding: ${escapeHTML(a.text||'Ikke lagret')}</p>`).join('')}</details>`:''}
function bindTrials(){
  document.querySelectorAll('[data-trial]').forEach(el=>el.oninput=()=>{activeTrial(el.dataset.trial)[el.dataset.field]=el.value;save()});
  document.querySelectorAll('[data-snapshot]').forEach(b=>b.onclick=()=>captureResult(b.dataset.snapshot));
  document.querySelectorAll('[data-new-trial]').forEach(b=>b.onclick=()=>{const id=b.dataset.newTrial;newTrial(id);save();go(state.page,false);$('#trial-'+id+'-prediction').focus()});
  document.querySelectorAll('[data-model-preset]').forEach(b=>b.onclick=()=>{const preset=MODEL_META[b.dataset.modelPreset].presets[+b.dataset.presetIndex][1];setParameters(preset)});
}
function setParameters(values){for(const [id,value] of Object.entries(values)){const el=$('#'+id);if(el.type==='checkbox')el.checked=value;else el.value=value;el.dispatchEvent(new Event('input'))}}
function dataTable(caption,headers,rows){return `<div class="tablewrap" tabindex="0" role="region" aria-label="${escapeHTML(caption)}"><table><caption>${escapeHTML(caption)}</caption><thead><tr>${headers.map(h=>`<th scope="col">${escapeHTML(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>i===0?`<th scope="row">${escapeHTML(v)}</th>`:`<td>${escapeHTML(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function page0(){return `<section class="hero"><img src="${photos.elg}" alt="En elg beveger seg over en eng i morgendis"><div class="herotext"><p class="eyebrow">Se sammenhengene. Prøv ideene.</p><h1>Hvor er bestanden<br>på vei?</h1><p>Ta rollen som naturforvalter. Følg sporene fra enkeltindivider til hele bestander – og oppdag hva som kan endre kursen.</p><div class="actions"><button class="btn light" data-route="session">Start øktruten · 48 min →</button></div></div><span class="photocredit">Foto: Bjørn Aksel Bjerke</span></section><div><span class="chip">7 stasjoner</span><span class="chip">Øktrute 48 min · full sti 60–75 min</span><span class="chip">14 kjerneoppgaver</span><span class="chip">Ingen forkunnskaper i modellering</span></div><div class="grid" style="margin-top:20px"><section class="card"><p class="kicker">Oppdraget</p><h3>Fra «hvor mange?»<br>til «hvorfor?»</h3><p>Du bistår forvaltningen i det fiktive Fjellvik. Kommunen vil forstå hvorfor viltbestandene endrer seg, og hvordan beslutninger kan bygge på mer enn årets telling.</p><p>På veien får du også avgrensede øvingscase om andre arter og områder.</p></section><section class="card tinted"><p class="kicker">Slik lærer du her</p><p><strong>Forutsi → Endre → Observer → Forklar.</strong> Skriv en kort forventning før du endrer en modell. Ta vare på resultatene (knappen ligger under modellen og resultatfeltene i hvert verksted), beskriv hva du ser og forklar hvorfor.</p><p>I kjerneoppgavene får du hint og tilbakemelding på svarene dine. Skriveoppgavene har svarforslag eller eksempler du kan åpne etter eget forsøk. Modellforslagene viser resultater ved bestemte innstillinger; åpne refleksjoner kan ha flere gode svar.</p><p class="small">Ingen tidtaking eller minuspoeng. Formler ligger bak «Vis meg matematikken». Alle stasjoner er åpne.</p></section></div><section class="card"><h3>Etter turen kan du …</h3><div class="three"><p><strong>Forklare endring</strong><br><span class="small">Koble fødsel, død og vandring til bestanden ved neste telling.</span></p><p><strong>Vurdere mekanismer</strong><br><span class="small">Skille tetthet, miljø, demografi og predasjon.</span></p><p><strong>Begrunne et valg</strong><br><span class="small">Bruke modeller og usikkerhet i et forvaltningsresonnement.</span></p></div></section>${state.legacyAnswers.length?'<p class="transfer">Oppgavene er oppdatert. Tidligere svar på reviderte spørsmål er bevart i feltboken; nye spørsmål får ny fremdrift.</p>':''}${routeCard()}<section class="card"><h3>Hele læringsstien · 60–75 minutter</h3><p><strong>Kjernen:</strong> kort teori, 14 oppgaver, ett veiledet forsøk i hvert av de fem verkstedene og fem korte setninger i forvaltningsnotatet. Én setning per forsøksfelt er nok.</p><p><strong>Valgfri fordypning:</strong> flere forsøk, modellbegrensninger, formler og faglitteratur. I «Til Fjellvik» kan du notere stikkord som du tar med til sluttoppgaven.</p><p class="small">Tidsanslagene er foreløpige og ikke prøvd ut med studenter. Sett av ca. 60–75 minutter til kjernen. To økter på 35–45 minutter gir rom for samtale: stasjon 1–4 først, stasjon 5–7 og feltboken neste gang.</p></section><details><summary>Praktisk bruk og personvern</summary><p>Filen virker uten nett. Svar og notater lagres lokalt i nettleseren når det er tillatt; ingenting sendes til en server. Fremdrift følger ikke automatisk med til en annen enhet eller nettleser. I feltboken kan du laste ned feltboken som tekst. Dette er en læringsressurs, ikke en eksamen.</p><p>Bildene er tatt av Bjørn Aksel Bjerke. Øvingsdata og modeller er pedagogiske konstruksjoner, ikke bestandsestimater for artene på bildene.</p></details>`}
function page1(){return head(1,'Fire veier til endring','Før vi velger en modell, trenger vi et regnskap. Bestandsdynamikk handler også om sammensetning og utbredelse – men vi begynner med antallet.',5)+`<div class="card tinted"><p class="kicker">Tenk som en forvalter</p><h3>Hvem kom til – og hvem forsvant?</h3><p>Fødsler og innvandring tilfører dyr. Dødsfall og utvandring fjerner dyr. Jakt er en del av dødeligheten, og skal ikke telles som et ekstra tap dersom den allerede er inkludert.</p><div class="budget"><div><strong>100</strong><small>ved start</small></div><span>+</span><div><strong>25</strong><small>født</small></div><span>−</span><div><strong>15</strong><small>døde</small></div><span>+</span><div><strong>8</strong><small>inn</small></div><span>−</span><div><strong>3</strong><small>ut</small></div></div>${math('<p><strong>N<sub>t+1</sub> = N<sub>t</sub> + B − D + I − E</strong></p><p>N er antall dyr. B er fødsler, D dødsfall, I innvandring og E utvandring i intervallet mellom to tellinger. Tallene må gjelde samme område og tidsrom. Dyr som både fødes og dør i intervallet inngår i begge hendelsene.</p>')}</div>`+quiz('budget')+`<div class="card"><h3>En telling er et øyeblikksbilde</h3><p>To like store bestander kan ha ulik aldersfordeling, ulik rekruttering og ulik avhengighet av naboområder. Dessuten kan antall <em>observerte</em> dyr endres fordi vi oppdager en annen andel av dyrene.</p></div>`+quiz('balance')+transfer(1);}
function page2(){return head(2,'Vekst som bygger på vekst','Fem prosent høres lite ut. Men fem prosent av en stadig større bestand blir flere og flere dyr.',8)+`<div class="grid"><div>${photo('hjort','En hjortebukk i steinete terreng')}<p class="quote">Gjett først: Vil 5 % årlig vekst gi 50 nye dyr eller omtrent 63 nye dyr etter ti år, når vi starter på 100?</p></div><section class="card"><p class="kicker">Kort teori</p><h3>Én faktor fra år til år</h3><p>Vekstfaktoren <strong>lambda (λ)</strong> forteller hva årets bestand må ganges med for å få neste års bestand.</p><p><strong>λ &gt; 1:</strong> vekst<br><strong>λ = 1:</strong> stabilt antall<br><strong>λ &lt; 1:</strong> nedgang</p><p>Ved λ = 1,05 blir 100 til 105. Året etter regnes 5 % av 105, ikke av 100.</p></section></div><section class="card"><p class="kicker">Modellverksted 01</p><h3>La bestanden vokse</h3>${trialStart('growth')}<div class="split"><div><label class="range" for="growthRate">Årlig endring <output id="growthRateOut"></output></label><input id="growthRate" type="range" min="-10" max="15" value="5" step="1"><label class="range" for="growthYears">Tid <output id="growthYearsOut"></output></label><input id="growthYears" type="range" min="1" max="30" value="10"><p class="small">Valgfri utforsking: prøv også 0 % og −5 %.</p><div id="growthResult" role="status"></div></div><div><div class="chartbox" id="growthChart"></div><p class="note">Startbestand: 100 dyr. Konstant årlig vekstfaktor. Ingen endring i miljø eller tetthetseffekt.</p></div></div>${trialEnd('growth')}${math('<p><strong>N<sub>t</sub> = N<sub>0</sub> × λ<sup>t</sup></strong>, der λ = 1 + prosentendring / 100.</p><p>100 × 1,05<sup>10</sup> ≈ 163. Fem prosent årlig vekst gir altså omtrent 63 flere dyr etter ti år. Modellen bruker desimaltall; visningen avrundes.</p>')}</section>`+quiz('lambda')+quiz('growth')+transfer(2);}
function page3(){return head(3,'Når det blir trangt','Hva endrer seg når flere dyr deler de samme ressursene? Se etter en tilbakekobling fra tetthet til overlevelse eller reproduksjon.',9)+`<div class="grid"><section class="card tinted"><p class="kicker">Økologisk bestandsregulering</p><h3>Flere dyr → mindre per dyr</h3><p>Bestandens tetthet påvirker demografiske rater som overlevelse og reproduksjon, for eksempel gjennom matkonkurranse. Når høyere tetthet gir lavere vekst per individ, oppstår negativ tilbakekobling som kan stabilisere bestanden.</p></section><section class="card"><p class="kicker">Miljø og begrensning</p><h3>Vinteren kan slå inn</h3><p>En værhendelse kan begrense bestanden uten selv å være utløst av tettheten. Effekten kan likevel være sterkere ved høy tetthet eller ugunstig aldersfordeling.</p></section></div><section class="card"><h3>To ulike tilbakekoblinger</h3><p><strong>Økologisk:</strong> flere dyr → mindre mat per dyr → lavere reproduksjon eller overlevelse.</p><p><strong>Forvaltningsstyrt:</strong> bestand over et valgt mål → forvaltere øker jaktuttaket → større tap fra jakt. Under målet kan de redusere uttaket.</p><p>Begge kan motvirke avvik. Jaktregelen beskriver et forvaltningstiltak; den dokumenterer ikke tetthetsavhengige biologiske rater. Et politisk bestandsmål er heller ikke det samme som bæreevnen K.</p></section><section class="card"><p class="kicker">Modellverksted 02</p><h3>Ressurser setter en ramme</h3>${trialStart('density')}<div class="split"><div><label class="range" for="densityN">Startbestand <output id="densityNOut"></output></label><input type="range" id="densityN" min="30" max="350" step="10" value="60"><label class="range" for="densityK">Bæreevne, K <output id="densityKOut"></output></label><input type="range" id="densityK" min="100" max="400" step="10" value="250"><label class="option"><input type="checkbox" id="winter"><span>En hard vinter ved år 8<br><small>Fjerner 30 % i denne øvingsmodellen.</small></span></label><div id="densityResult" class="small" role="status" style="margin-top:16px"></div></div><div><div class="chartbox" id="densityChart"></div><div class="legend"><span><i class="swatch"></i>Bestand</span><span><i class="swatch dotted"></i>Bæreevne K</span></div></div></div><p class="note">K er et modellert likevektsnivå under gitte forhold, ikke et fast naturgitt maksimum eller et politisk bestandsmål. Modellen holder K konstant gjennom hvert forsøk. Vinteren har samme prosentvise effekt ved alle tettheter her.</p>${trialEnd('density')}${math('<p>Vi bruker den kontinuerlige logistiske modellen: <strong>dN/dt = rN(1 − N/K)</strong>, med r = 0,25 per år. Mellom to år beregnes den eksakte løsningen <strong>N<sub>t+1</sub> = K / [1 + (K/N<sub>t</sub> − 1)e<sup>−r</sup>]</strong>.</p><p>Ved år 8 multipliseres resultatet eventuelt med 0,70. Kurven forbinder årlige verdier. Modellen utelater alder, vandring, tidsforsinkelser og øvrig miljøvariasjon.</p>')}</section>`+quiz('density')+quiz('regulation')+transfer(3);}
function page4(){return head(4,'Hundre dyr er ikke hundre like dyr','Bestandens framtid ligger også i hvem som finnes der nå: alder, kjønn, kondisjon og erfaringer fra tidligere år.',8)+`<div class="grid"><div>${photo('rein','En rein med gevir i et mørkt fjellandskap')}<p class="note">Bildet illustrerer temaet. Modellens rater er ikke estimater for rein.</p></div><section class="card tinted"><h3>Livet har ulike faser</h3><p>Unge individer, dyr i sin beste alder og gamle individer har ofte ulik overlevelse og reproduksjon. Kjønnsfordelingen betyr også noe, i samspill med artens paringssystem.</p><p>For mange langlivede hjortedyr er voksne hunndyr viktige for rekrutteringen. Det betyr ikke at hanner alltid er uten betydning.</p></section></div><section class="card"><p class="kicker">Modellverksted 03</p><h3>Samme antall. Ulik neste sesong.</h3><p>Du starter alltid med <strong>100 hunndyr</strong>. Bruk skyveknappen til å endre hvor mange som er voksne ved start. Resten er hunnkalver. Modellen beregner hvor mange hunndyr vi forventer ved neste telling, ett år senere.</p>
${trialStart('age')}
<div class="actions"><button class="btn secondary" data-adults="30">Prøv 30 voksne + 70 kalver</button><button class="btn secondary" data-adults="70">Prøv 70 voksne + 30 kalver</button></div>
<p class="small" style="margin-top:12px">Knappene stiller inn skyveknappen for deg. Du endrer startbestandens sammensetning; du flytter ikke de samme dyrene framover i alder.</p><label class="range" for="adultShare">Voksne hunndyr ved start <output id="adultShareOut"></output></label><input id="adultShare" type="range" min="20" max="90" step="5" value="60"><div class="dotbar" id="ageBar" role="img" aria-label="Fordeling mellom voksne og kalver"></div><div class="legend"><span><i class="swatch"></i>Voksne: venstre, helfarget</span><span>Kalver: høyre, skravert</span></div><div id="ageResult" class="stats" role="status"></div><details><summary>Se startfordeling og resultater som tabell</summary><div id="ageTable"></div></details>${trialEnd('age')}<p class="note"><strong>Modellens grense:</strong> dette er én telling ett år fram. Modellen beregner ikke fullstendige overganger mellom aldersgrupper gjennom flere år eller generasjoner.</p><p class="small">I modellen overlever 90 % av de voksne og 60 % av kalvene. Hvert voksent hunndyr ved start bidrar i gjennomsnitt med 0,30 nye hunnkalver som fortsatt lever ved neste telling. Kalvene ved start får ikke avkom i dette intervallet. Ingen vandring.</p>${math('<p><strong>Neste telling = 0,90 × voksne + 0,60 × kalver + 0,30 × voksne.</strong></p><p>0,30 er rekrutterte hunnkalver per voksent hunndyr ved start – ikke antall fødte. Overlevelse fram til telling er allerede inkludert i dette leddet. Forventningsverdier kan være desimaltall. Dette er en forenklet ettårsmodell, uten egne grupper for gamle individer.</p>')}</section>`+quiz('age')+`<section class="card"><h3>Bestanden har en historie</h3><p>En <strong>kohort</strong> er en årsklasse. Et godt fødselsår kan gi mange individer og gode levevilkår. Effektene kan følge årsklassen videre. <strong>Moreffekter</strong> oppstår når egenskaper eller miljø hos mor påvirker avkommet, utover dets direkte miljø og nedarvede gener.</p><p>En svak årsklasse kan derfor påvirke rekrutteringen flere år etter at den ble født.</p></section>`+quiz('cohort')+transfer(4);}
function page5(){return head(5,'Bestanden stopper ikke ved grensen','En lokal bestand kan vokse fordi dyr flytter inn. Det er ikke nødvendigvis et tegn på at reproduksjon og overlevelse er gode lokalt.',6)+`<div class="grid"><div>${photo('hjort','En hjort i bratt terreng')}<p class="quote">Hva om det som ser ut som lokal suksess, kommer fra naboområdet?</p></div><section class="card"><h3>Kildebestander og slukbestander</h3><p>En <strong>kildebestand (source)</strong> har lokal reproduksjon som kan oppveie dødeligheten og gi et overskudd av individer. En <strong>slukbestand (sink)</strong> har lokal reproduksjon som ikke oppveier dødeligheten og er avhengig av innvandring for å opprettholdes over tid.</p><p>Ett års tall er en illustrasjon, ikke nok til å fastslå et områdes varige rolle. Du trenger flere år med data om lokale rater og vandring.</p></section></div><section class="card tinted"><p class="kicker">To områder · samme år</p><div class="tablewrap"><table><caption class="sr-only">Regnskap for område A og B</caption><thead><tr><th>Hendelse</th><th>Område A</th><th>Område B</th></tr></thead><tbody><tr><td>Bestand ved start</td><td>100</td><td>100</td></tr><tr><td>Fødsler</td><td>30</td><td>12</td></tr><tr><td>Dødsfall</td><td>10</td><td>20</td></tr><tr><td>Vandring</td><td>15 ut til B</td><td>15 inn fra A</td></tr></tbody></table></div><p class="small" style="margin-top:15px">Ingen annen vandring. Dyrene som flytter, blir ikke borte fra den samlede bestanden: de skifter område.</p></section>`+quiz('migration')+`<details><summary>Se begge regnskapene</summary><p>A: 100 + 30 − 10 − 15 = <strong>105</strong>.<br>B: 100 + 12 − 20 + 15 = <strong>107</strong>.<br>Samlet: 200 + 42 − 30 = <strong>212</strong>. Vandring mellom A og B kanselleres når områdene ses samlet.</p></details>`+quiz('dispersal')+transfer(5);}
function page6(){return head(6,'Ett rovdyr – eller mange?','For å forstå predasjon må vi skille mellom antall rovdyr, hva hvert rovdyr spiser og hvor stor andel av byttedyrbestanden som tas.',11)+`<div class="grid"><div>${photo('gaupe','En gaupe på steinete mark')}<h3>Numerisk respons</h3><p>Antall eller tetthet av rovdyr endres når tilgangen på byttedyr endres. Det kan skje gjennom reproduksjon, overlevelse eller forflytning.</p></div><div>${photo('rev','En rødrev i grønt gress')}<h3>Funksjonell respons</h3><p>Konsum per rovdyr per tidsenhet endres med byttedyrtettheten. Metning og håndteringstid kan bøye av kurven. Bytte av foretrukket byttedyr kan bidra til en S-formet kurve.</p></div></div>`+quiz('response')+`<section class="card"><p class="kicker">Modellverksted 04</p><h3>Antall tatt er ikke det samme som andel tatt</h3>
<p>Her sammenligner du <strong>to teoretiske funksjonelle responser</strong>. Begge kurvene viser hvor mange byttedyr <strong>ett rovdyr</strong> forventes å ta per måned ved ulik byttedyrtetthet. De er ikke målte kurver for gaupe eller rev.</p>
<div class="transfer" id="pred-learning-goal"><strong>Dette skal du oppdage</strong><ol><li><strong>Kurvens form:</strong> Type II og III gir ulike uttak ved samme byttedyrtetthet. Sammenlign særlig ved lav tetthet.</li><li><strong>Fra ett rovdyr til hele området:</strong> Flere rovdyr kan øke totaluttaket og andelen som tas, selv om konsumet per rovdyr er likt.</li><li><strong>Skillet mot numerisk respons:</strong> En numerisk respons betyr at rovdyrantallet endres som følge av byttedyrtilgangen. Her velger du rovdyrantallet selv; modellen beregner ikke denne responsen.</li></ol></div>
${trialStart('pred')}<p class="small"><strong>Valgfri utforsking:</strong> prøv også 400 byttedyr med begge responsformer og 3 rovdyr. Er rangeringen fortsatt lik?</p>
<div class="actions" style="margin-bottom:20px"><button class="btn secondary" data-predpreset="lowII">Start med type II · 100 byttedyr</button><button class="btn secondary" data-predpreset="lowIII">Sammenlign type III · 100 byttedyr</button></div>
<div class="split"><div><label for="responseType"><strong>Velg kurve for beregningen</strong></label><select id="responseType"><option value="2">Type II – øker, så flater den ut</option><option value="3">Type III – S-formet</option></select><label class="range" for="preyN">Byttedyr i et fast område <output id="preyNOut"></output></label><input id="preyN" type="range" min="50" max="1000" step="10" value="100"><label class="range" for="predN">Antall rovdyr <output id="predNOut"></output></label><input id="predN" type="range" min="1" max="10" value="3"><p class="small"><strong>Hvorfor endres ikke kurven når du velger flere rovdyr?</strong> Den viser konsum per rovdyr. I denne modellen spiser hvert rovdyr like mye ved en gitt byttedyrtetthet, uavhengig av antall rovdyr. Flere rovdyr øker derfor totaluttaket og andelen som tas i resultatfeltene under grafen.</p></div><div><p class="kicker">Teoretiske kurver · konsum per rovdyr</p><div class="chartbox" id="predChart"></div><div class="legend"><span><i class="swatch"></i>Type II</span><span><i class="swatch orange"></i>Type III</span></div></div></div><p id="predSelection" class="small" role="status"></p><div class="stats" id="predResult" role="status"></div><div class="feedback good" id="predExplanation" role="status"></div>
${trialEnd('pred')}<p class="note">Fast areal: antall brukes som mål på tetthet. Kurvene viser konsum per rovdyr per måned, ikke totaluttak. Glideren for antall rovdyr endrer totaluttaket i resultatfeltene, men simulerer ikke en automatisk numerisk respons. Ingen artstilpassede parameterverdier.</p>${math('<p>Type II: <strong>f(N) = 12N/(200 + N)</strong>.<br>Type III: <strong>f(N) = 12N²/(200² + N²)</strong>.<br>Totaluttak per måned = antall rovdyr × f(N).<br>Andel tatt = totaluttak / N × 100 %.</p><p>Begge kurvene nærmer seg 12 byttedyr per rovdyr per måned. Dette er en øyeblikksberegning ved gitt tetthet. Modellen følger ikke uttømming av byttedyr gjennom måneden og er ikke en årsprognose.</p>')}</section><section class="card tinted"><h3>Predasjonsfelle (predator pit): mer enn et lavt antall</h3><p>I en predasjonsfelle bidrar predasjon til å holde byttedyrbestanden på et lavt nivå og hindrer vekst mot et høyere nivå. I klassiske modeller kan en terskel skille en lav og en høy stabil tilstand. Slike alternative tilstander må undersøkes, ikke tas for gitt i en virkelig bestand.</p><p><strong>Lav og stabil bestand er ikke nok:</strong> vurder byttedyrenes tilvekst opp mot predasjonsdødelighet, andre tap og vandring. En type III-kurve alene dokumenterer ingen felle.</p><p>Utviklingen ved redusert predasjonstrykk kan gi viktig kunnskap. Vekst etter reduksjonen viser likevel ikke alene at to stabile tilstander finnes. Vi må følge utviklingen og vurdere konkurrerende forklaringer.</p><details><summary>Valgfri refleksjon · Hva må undersøkes?</summary>${shortField('note-pit','Hvilke ytterligere data trenger vi før vi kan konkludere med en predasjonsfelle?',state.notes.pit,'data-note="pit"')}${answerSupport('pit')}</details></section>`+quiz('pit')+transfer(6);}
function page7(){return head(7,'Du skal gi et råd','Skill mellom observasjoner, mulige forklaringer og valget du anbefaler. Flere råd kan være forsvarlige når begrunnelsen er tydelig.',14)+`
<div class="grid"><div>${photo('raadyr','To rådyr i høyt, tørt gress')}<p class="note">Fjellvik er fiktiv. Alle tall nedenfor er øvingsdata.</p></div><section class="card dark"><p class="kicker">Oppdragsbrev · Fjellvik</p><h3>Hvordan kan vi opprettholde en levedyktig bestand og et forsvarlig jaktuttak?</h3><p>Kommunen ønsker å unngå bestandsnedgang og samtidig vurdere videre jakt. Den skal ta stilling til neste års uttak. Det er observert gaupe, og vandring er dårlig kjent.</p><p>Forklar hvilke hensyn du prioriterer, hvor mye risiko du aksepterer, og hva som skal få deg til å endre rådet.</p></section></div>
<section class="card"><h3>Dette viser dataene – foreløpig</h3>${dataTable('Fiktive feltdata for to år',['Indikator','I fjor','I år'],[['Anslått antall før jakt','220','240'],['Illustrativ usikkerhet rundt anslaget','±15 dyr (205–235 dyr)','±15 dyr (225–255 dyr)'],['Kalver per voksen hunn, observert om høsten','0,65','0,40'],['Jaktuttak','30','Skal vurderes']])}<p style="margin-top:15px"><strong>Slik leser du årets tall:</strong> Anslaget er <strong>240 dyr med en illustrativ usikkerhet på ±15 dyr</strong>. Det betyr 15 dyr under og over anslaget: <strong>225–255 dyr</strong>. Tallene i parentes viser intervallets nedre og øvre grense.</p><p class="small">Dette er et eksempel med høy presisjon: omtrent ±6–7 %. Spennene er valgt for øvelsen og er ikke beregnede 95 % konfidensintervaller. Hvor bredt et faglig begrunnet intervall bør være, avhenger av metode og datagrunnlag. Her må du etterspørre hvordan anslagene er beregnet og om oppdagbarheten er håndtert. Intervallene overlapper fra 225 til 235 dyr, men overlapp alene er ikke en formell test av endring.</p><p class="small"><strong>Faglig bakgrunn:</strong> Presisjonen i bestandsanslag varierer med metode, datamengde og oppdagbarhet. Se <a href="https://doi.org/10.1002/jwmg.22207" target="_blank" rel="noopener">Forsyth mfl. (2022)</a> og et eksempel med kameradata hos <a href="https://doi.org/10.1093/jmammal/gyac016" target="_blank" rel="noopener">Bengsen mfl. (2022)</a>. Øvingstallene er valgt for denne oppgaven og er ikke hentet fra disse studiene.</p><p><strong>Kalver per hunn er ingen årsaksforklaring:</strong> fallet fra 0,65 til 0,40 kan henge sammen med reproduksjon, kalveoverlevelse, observasjonsforhold eller hvilke dyr og områder som ble undersøkt. Gaupeobservasjoner alene fastslår ikke predasjonsdødeligheten.</p></section>
<section class="card" id="uncertainty-types"><h3>Hva varierer: bestanden eller observasjonene?</h3><p><strong>Prosessvariasjon:</strong> Fødsler, overlevelse og vandring varierer. Da endres det faktiske antallet eller sammensetningen av bestanden. En hard vinter kan for eksempel gi flere dødsfall.</p><p><strong>Observasjonsusikkerhet:</strong> Registreringene gir ufullstendig kunnskap om bestanden. Oppdagbarhet, innsats og hvilke dyr vi undersøker, påvirker hva vi ser. Tellinger kan også variere tilfeldig ved samme bestand og oppdagbarhet.</p><p><strong>Spør hver gang:</strong> Har bestanden endret seg, eller har måten vi observerer den på endret seg? Begge deler kan skje samtidig. Bedre registreringer kan redusere observasjonsusikkerhet, men fjerner ikke biologisk årsvariasjon.</p></section>
<section class="card tinted"><p class="kicker">Kort demonstrasjon · oppdagbarhet</p><h3>Flere sett, like mange til stede</h3><p>Hold bestanden fast på <strong>200 dyr</strong>. Sett oppdagbarheten til 60 % og deretter 80 %. Hva endres?</p><label class="range" for="detectionP">Oppdagbarhet, p <output id="detectionPOut"></output></label><input id="detectionP" type="range" min="20" max="100" step="5" value="60"><p id="detectionResult" role="status"></p><div class="detection-meter" aria-hidden="true"><span id="detectionBar"></span></div><div id="detectionTable"></div><p class="small">Dette er <strong>forventningsverdier</strong>, ikke en simulert telling. Faktiske tellinger kan variere også når N og p er uendret. Vi antar her at hvert dyr kan registreres høyst én gang, med samme oppdagelsessannsynlighet.</p><p class="formula"><strong>E(C<sub>t</sub>) = p<sub>t</sub> × N<sub>t</sub></strong></p><p class="small">N<sub>t</sub> er faktisk bestandsstørrelse, C<sub>t</sub> er antall observerte dyr, p<sub>t</sub> er sannsynligheten for at et individ oppdages. E(C<sub>t</sub>) er forventet antall observerte dyr. Bestandsanslagene i tabellen over er ikke oppgitt som råtellinger; demonstrasjonen forklarer hvorfor observasjonsmetoden betyr noe.</p>${shortField('note-detection','Kan vi konkludere med at bestanden har økt dersom vi observerer flere dyr ved neste telling? Begrunn kort.',state.notes.detection,'data-note="detection"')}${answerSupport('detection')}</section>
${quiz('decision')}
<section class="card"><p class="kicker">Modellverksted 05 · deterministiske scenarioer</p>${state.route==='session'?'<p class="transfer"><strong>Fordypning i øktruten.</strong> Gå videre til usikkerhetsoppgaven og forvaltningsnotatet hvis dere følger 48-minuttersruten.</p>':''}<h3>Samme uttak. Tre mulige utviklingsforløp.</h3>${trialStart('quota')}<label class="range" for="quota">Årlig uttak <output id="quotaOut"></output></label><input type="range" id="quota" min="0" max="50" step="5" value="30"><div class="chartbox" id="quotaChart"></div><div id="quotaResult" class="feedback" role="status"></div><p class="note"><strong>Hva modellen kan si:</strong> hvilke følger et fast uttak får hvis hver vekstfaktor varer i fem år. <strong>Hva den ikke kan si:</strong> hvor sannsynlige forløpene er, sannsynlighet for bestandsnedgang eller utryddelsesrisiko. Dette er ikke en fullstendig risikoanalyse. Modellen er ikke kalibrert mot Fjellvik og beregner ingen faktisk kvote.</p>${trialEnd('quota')}${math('<p><strong>N<sub>t+1</sub> = maks(0, λN<sub>t</sub> − H)</strong>, med start N<sub>0</sub> = 240. H er fast årlig uttak og λ er konstant lik 0,95, 1,10 eller 1,20. λ omfatter fødsel og annen dødelighet før jakt, uten vandring. Jakt er et additivt tap, begrenset til tilgjengelige dyr.</p><p>Dette er deterministiske beregninger uten tilfeldig årlig variasjon, endret aldersstruktur eller tetthetsavhengighet. I virkeligheten kan rater samvariere, og jakt kan delvis erstatte andre dødsårsaker. Scenarioene har ingen tilordnede sannsynligheter.</p>')}</section>
${quiz('uncertainty')}
<section class="card"><p class="kicker">Kjerneaktivitet · ditt forvaltningsnotat</p><h3>Ett råd, en tydelig begrunnelse</h3><details class="case-notes"><summary>Hent fram Fjellvik-notatene dine fra stasjon 1–6</summary>${fjellvikNotes()}</details><p>Skriv omtrent én setning per felt. I anbefalingen tar du med mål, antakelser, risiko og hva som skal utløse ny vurdering. Teksten vurderes av deg selv eller i samtale med andre.</p>

function page8(){let n=groups.flat().filter(done).length;return `<div class="stephead"><p class="eyebrow">Din feltbok · ta læringen videre</p><h1>${n===total?'Du har fulgt sporene.':'Samle trådene.'}</h1><p class="lead">En god forvalter trenger ikke kunne alle formler utenat. Men må kunne forklare hvilke prosesser, antakelser og data som ligger bak et råd.</p></div><section class="card tinted"><h3>${n} av ${total} oppgaver i hele læringsstien er løst</h3>${state.route==='session'?`<p><strong>Øktruten:</strong> ${SESSION_TASKS.filter(done).length} av ${SESSION_TASKS.length} prioriterte oppgaver. Øvrige oppgaver er tilgjengelige for videre arbeid.</p>`:''}<p>Et riktig svar etter flere forsøk teller fullt. Gå tilbake til en stasjon for å undersøke forklaringen en gang til.</p><div class="results">${groups.map((g,i)=>g.length?`<div class="resultrow"><button data-page="${i}">${i}. ${titles[i]}</button><span>${g.filter(done).length}/${g.length} løst</span></div>`:'').join('')}</div></section><div class="grid"><section class="card"><h3>Fem spørsmål å ta med i felt</h3><ol><li>Er endringen biologisk, eller kan den skyldes hvordan vi teller?</li><li>Skyldes den fødsler, dødsfall eller vandring?</li><li>Hvem består bestanden av?</li><li>Hvordan virker tetthet, miljø og andre arter sammen?</li><li>Hvilke nye data kan endre rådet vårt?</li></ol></section><section class="card"><h3>Valgfri refleksjon</h3>${note('reflection','Hva ville du undersøkt først i en virkelig bestand?','Før tenkte jeg … Nå ser jeg …\nDet første jeg ville undersøkt, er …')}${answerSupport('reflection')}<p class="small" style="margin-top:12px">Notatet ditt og forvaltningsrådet kan tas med til seminaret.</p></section></div>${routePrompt(8)}${legacyExitHTML()}<section class="card"><h3>Dine modellforsøk</h3>${fieldbookTrials()}</section><section class="card"><h3>Til Fjellvik · notatene dine underveis</h3>${fjellvikNotes()}</section><section class="card"><h3>Ditt forvaltningsnotat</h3>${adviceHTML()}</section><section class="card"><h3>Refleksjoner og oppgavesvar</h3>${['pit','detection'].filter(k=>state.notes[k]).map(k=>`<h4>${NOTE_LABELS[k]}</h4><p class="student-note">${escapeHTML(state.notes[k])}</p>`).join('')}<details><summary>Se siste svar på kjerneoppgavene</summary>${groups.flat().filter(id=>state.answers[id]).map(id=>{const q=Q[id],a=state.answers[id];return `<p><strong>${escapeHTML(q.title)}</strong><br>${escapeHTML(q.type==='number'?a.value+' dyr':q.options[a.value])}<br>${escapeHTML(a.text)}</p>`}).join('')||'<p>Ingen svar registrert.</p>'}</details>${legacyHTML()}</section><section class="card"><h3>Ta med feltboken</h3><p>Last ned en tekstfil med prediksjoner, bevarte modellresultater og parametere, observasjoner, forklaringer, refleksjoner og forvaltningsnotatet. Fjellvik-notatene fra hver stasjon, kjerneoppgaver, tilbakemeldinger og tidligere svar følger også med. Filen kan leses og deles, men importeres ikke tilbake i læringsstien.</p><div class="actions"><button class="btn" id="export">Last ned feltboken (.txt) ↓</button><button class="btn secondary" id="print">Skriv ut denne oppsummeringen</button><button class="btn secondary" id="resetBottom">Start på nytt</button></div><div class="feedback" id="exportStatus" role="status"></div></section><details><summary>Begrepskort – en liten feltordbok</summary><div class="tablewrap"><table><tbody>${[['Bestandsdynamikk','Endringer i antall, sammensetning og utbredelse over tid.'],['Vital rate','Rate for en demografisk prosess, for eksempel overlevelse eller reproduksjon.'],['λ (lambda)','Vekstfaktor mellom to tellinger. Over 1 betyr vekst.'],['Bæreevne K','Modellert likevektsnivå under bestemte miljø- og ressursforhold.'],['Økologisk regulering','Tetthet virker tilbake på demografiske rater og kan stabilisere bestanden.'],['Forvaltningsstyrt regulering','Forvaltere justerer tiltak, for eksempel jakt, ut fra bestandsmål og kunnskap.'],['Prosessvariasjon','Biologiske prosesser som fødsler, overlevelse og vandring varierer og gir variasjon i den faktiske bestanden.'],['Observasjonsusikkerhet','Registreringene gir ufullstendig kunnskap om bestanden. Oppdagbarhet, innsats, utvalg og tilfeldig variasjon påvirker hva vi ser.'],['Oppdagbarhet, p','Sannsynligheten for at et individ blir oppdaget ved en undersøkelse.'],['Predasjonsfelle (predator pit)','Predasjon holder byttedyr på et lavt nivå og hindrer vekst mot et høyere nivå; lavt antall alene er ikke dokumentasjon.'],['Begrensning','En påvirkning som reduserer bestand eller vekst uten nødvendigvis å stabilisere den.'],['Kohort','Individer født i samme periode, ofte samme år.'],['Netto vandring','Innvandring minus utvandring.'],['Kildebestand (source)','Lokal reproduksjon oppveier dødeligheten og kan gi et overskudd av individer.'],['Slukbestand (sink)','Lokal reproduksjon oppveier ikke dødeligheten; innvandring trengs for å opprettholde bestanden over tid.'],['Funksjonell respons','Konsum per rovdyr per tidsenhet som funksjon av byttedyrtetthet.'],['Numerisk respons','Endring i antall eller tetthet av rovdyr med byttedyrtilgang.']].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></details><details><summary>Kilder, bilder og modellnotater</summary><h3>Supplerende faglig støtte</h3>
<p>Kildene nedenfor gir matematisk bakgrunn og viser hvordan modeller kan brukes i forvaltning. De er <strong>valgfri fordypning</strong>. Begynn gjerne med Gotelli for modellene og Nichols med medforfattere for forvaltningsnytten.</p>
<ol class="reading-list">
<li id="ref-gotelli"><p><strong>Eksponentiell og logistisk vekst · modellverksted 01 og 02</strong><br>Gotelli, N. J. (2008). <em>A Primer of Ecology</em>, 4. utgave. Sinauer Associates.</p><p>Kapittel 1 og 2 gjennomgår vekstmodellene, antakelsene og variasjoner av dem. Kapittel 3 behandler aldersstruktur, og kapittel 6 predasjon. Vedlegget gir en innføring i matematisk modellbygging, likevekt og stabilitet.</p><p class="small"><strong>Lesetips:</strong> Start med forskjellen mellom konstant vekstfaktor og tetthetsavhengig vekst. <a href="https://toc.library.ethz.ch/objects/pdf/e05_978-0-87893-318-1_01.pdf" target="_blank" rel="noopener">Se innholdsfortegnelsen (PDF, ikke hele boken)</a>. Boken kan finnes via fagbiblioteket.</p></li>
<li id="ref-caswell"><p><strong>Alders- og stadiestruktur · modellverksted 03</strong><br>Caswell, H. (2001). <em>Matrix Population Models: Construction, Analysis, and Interpretation</em>, 2. utgave. Sinauer Associates.</p><p>Gir en grundig matematisk behandling av modeller som deler bestanden i alders- eller livsstadiegrupper. Relevant for å forstå hvordan overlevelse og reproduksjon i hver gruppe bidrar til bestandsutviklingen.</p><p class="small"><strong>Lesetips:</strong> Kapittel 2–4 er en inngang til alders- og stadieklassifiserte modeller. Dette er mer avansert fordypning; læringsstiens ettårsregnskap er en forenkling og forutsetter ikke matrisealgebra. <a href="https://www.oup.com.au/books/higher-education/biology/9780878931217" target="_blank" rel="noopener">Bokomtale og innholdsfortegnelse hos forlaget</a>.</p></li>
<li id="ref-holling"><p><strong>Funksjonelle responser · modellverksted 04</strong><br>Holling, C. S. (1959). Some Characteristics of Simple Types of Predation and Parasitism. <em>The Canadian Entomologist</em>, 91(7), 385–398. <a href="https://doi.org/10.4039/Ent91385-7" target="_blank" rel="noopener">doi:10.4039/Ent91385-7</a>.</p><p>Et grunnleggende originalarbeid bak de klassiske responsformene. Relevant for sammenhengen mellom byttedyrtetthet, søk, håndtering og konsum per rovdyr.</p><p class="small"><strong>Lesetips:</strong> Følg hvordan begrenset tid til søk og håndtering kan gi en kurve som flater ut. Læringsstien bruker illustrative responsfunksjoner og egne parameterverdier; type III-likningen her er en valgt teoretisk form, ikke en ordrett gjengivelse av en likning fra artikkelen.</p></li>
<li id="ref-pulliam"><p><strong>Vandring og source–sink-dynamikk · stasjon 5</strong><br>Pulliam, H. R. (1988). Sources, Sinks, and Population Regulation. <em>The American Naturalist</em>, 132(5), 652–661. <a href="https://doi.org/10.1086/284880" target="_blank" rel="noopener">doi:10.1086/284880</a>.</p><p>Et sentralt teoretisk arbeid om hvordan lokal reproduksjon, dødelighet og spredning kan knytte kilde- og slukbestander sammen.</p><p class="small"><strong>Lesetips:</strong> Koble resonnementet til område B: hvorfor kan en lokal bestand opprettholdes selv når fødslene ikke oppveier dødsfallene?</p></li>
<li id="ref-nichols"><p><strong>Nytten i naturforvaltning · stasjon 7 og modellverksted 05</strong><br>Nichols, J. D., Runge, M. C., Johnson, F. A. &amp; Williams, B. K. (2007). Adaptive harvest management of North American waterfowl populations: a brief history and future prospects. <em>Journal of Ornithology</em>, 148 (Suppl. 2), 343–349. <a href="https://doi.org/10.1007/s10336-007-0256-8" target="_blank" rel="noopener">doi:10.1007/s10336-007-0256-8</a>.</p><p>Viser en konkret anvendelse der bestandsmodeller inngår sammen med forvaltningsmål, alternative tiltak og overvåking. Nye observasjoner brukes til å lære om bestandenes respons på høsting og redusere usikkerhet.</p><p class="small"><strong>Lesetips:</strong> Finn koblingen mellom mål, modeller, handling og ny kunnskap. Spør hvordan dette kan overføres til rådet ditt for Fjellvik. Artikkelen gir et forvaltningseksempel; den er ikke kilde til øvingskvotene eller vekstfaktorene i læringsstien. <a href="https://www.usgs.gov/publications/adaptive-harvest-management-north-american-waterfowl-populations-a-brief-history-and" target="_blank" rel="noopener">Les sammendraget hos USGS</a>.</p></li>
</ol>
<p class="small"><strong>Videre om funksjonell respons:</strong> Papanikolaou mfl. (2020), <a href="https://esajournals.onlinelibrary.wiley.com/doi/10.1002/ecs2.3147" target="_blank" rel="noopener">On the mechanistic understanding of predator feeding behavior using the functional response concept</a>, <em>Ecosphere</em>, doi:10.1002/ecs2.3147.</p>
<p class="small"><strong>Predasjonsfeller:</strong> Clark, T. J., Horne, J. S., Hebblewhite, M. &amp; Luis, A. D. (2021). Stochastic predation exposes prey to predator pits and local extinction. <em>Oikos</em>, 130, 300–309. <a href="https://doi.org/10.1111/oik.07381" target="_blank" rel="noopener">doi:10.1111/oik.07381</a>. Skiller mellom lav likevekt og predasjonsfelle; valgfri avansert fordypning.</p><p class="small"><strong>Oppdagbarhet:</strong> MacKenzie, D. I., Nichols, J. D., Sutton, N., Kawanishi, K. &amp; Bailey, L. L. (2005). Improving inferences in population studies of rare species that are detected imperfectly. <em>Ecology</em>, 86, 1101–1113. <a href="https://pubs.usgs.gov/publication/5224448" target="_blank" rel="noopener">Sammendrag og publikasjon hos USGS</a>. Forklarer hvorfor tellinger må tolkes med hensyn til ufullstendig oppdagelse.</p>
<p class="small">Lenkene går til innholdsfortegnelser, sammendrag eller publikasjonssider. Tilgang til hele bøker og enkelte artikler kan kreve bibliotektilgang. Tallene i læringsstien er fortsatt konstruerte øvingsdata.</p>
<p><strong>Foto:</strong> Bjørn Aksel Bjerke. Bildene viser elg, hjort, rein, gaupe, rødrev og rådyr. Bildene er nedskalert og vises delvis beskåret. Ingen foto er generert.</p><p><strong>Modeller:</strong> eksponentiell vekst med konstant λ; eksakt logistisk utvikling mellom årlige punkter med r = 0,25; en forenklet ettårsmodell for to grupper hunndyr; illustrative type II- og III-responser; tre deterministiske vekst- og høstingsscenarioer. Likninger, enheter og begrensninger er tilgjengelige i hvert verksted.</p><p>Versjon 1.7.1 · Selvstendig læringssti i bestandsdynamikk. Nett er kun nødvendig dersom du åpner de eksterne kildelenkene.</p></details>`}

function check(id){const q=Q[id];const raw=q.type==='number'?$(`#ans-${id}`).value:document.querySelector(`input[name="${id}"]:checked`)?.value;const box=$(`#fb-${id}`);if(raw===undefined||raw===''){box.className='feedback';box.textContent=q.type==='number'?'Skriv et antall først. Du kan bruke hintet hvis du står fast.':'Velg et svar først. Du kan prøve så mange ganger du vil.';return}const val=Number(raw);if(!Number.isFinite(val)||val<0||(q.type==='number'&&!Number.isInteger(val))){box.className='feedback';box.textContent='Bruk et helt antall dyr, null eller større.';return}const ok=q.type==='number'?val===q.answer:val===q.correct;let text=q.type==='number'?(ok?q.good:q.feedback(val)):q.feedback[val];state.answers[id]={value:val,correct:ok||done(id),lastCorrect:ok,text,attempts:(state.answers[id]?.attempts||0)+1};box.className='feedback'+(ok?' good':'');box.textContent=(ok?'✓ ':'Prøv igjen: ')+text;const k=$(`#q-${id} .kicker`);k.innerHTML='Din tur'+(done(id)?'<span class="donepill"> · løst ✓</span>':'');save();updateProgress()}
