function selfFeedback(){let n=state.checks.length;$('#selfFeedback').textContent=n===4?'Du har krysset av for alle fire kjennetegn. Les notatet én gang til: peker hver påstand på data eller en tydelig antakelse?':`${n} av 4 kjennetegn sjekket. ${['Start med å knytte et konkret råd til målet og feltdataene.','Skill tydelig mellom det som er observert og det du antar.','Gjør usikkerheten konkret: hvilke data ville endret vurderingen din?','Beskriv en anledning eller et funn som skal utløse ny vurdering.'][Math.min(n,3)]} Dette er egenvurdering, ikke automatisk vurdering av teksten.`}
function chart(target,series,{xMax,yMax,yLabel='Antall dyr',xLabel='År',ref=null,point=null,description='',tableXs=null}={}){
  const el=$(target),wasOpen=!!el.querySelector('details[open]');
  const w=Math.max(220,Math.round(el.clientWidth||660)),h=280,L=47,R=22,T=15,B=51;
  const x=n=>L+n/xMax*(w-L-R),y=n=>h-B-n/yMax*(h-T-B);
  const lineNames=['heltrukket','lange streker','korte streker'];
  const dashes=['','9 5','2 5'];
  let s=`<p class="chart-description" id="${el.id}-description">${escapeHTML(description)}</p><p class="note">Vannrett: ${escapeHTML(xLabel)}. Loddrett: ${escapeHTML(yLabel)}.</p><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-labelledby="${el.id}-description"><title>${escapeHTML(description)}</title>`;
  for(let k=0;k<=4;k++){let v=k*yMax/4;s+=`<line x1="${L}" y1="${y(v)}" x2="${w-R}" y2="${y(v)}" stroke="#d9dfd3"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;let t=xMax*k/4;s+=`<text x="${x(t)}" y="${h-B+23}" text-anchor="middle">${decimal(t)}</text>`}
  s+=`<text x="${w-R}" y="${h-6}" text-anchor="end">${escapeHTML(xLabel)}</text>`;
  if(ref!==null)s+=`<line x1="${L}" x2="${w-R}" y1="${y(ref)}" y2="${y(ref)}" stroke="#59685e" stroke-width="2" stroke-dasharray="3 5"/>`;
  series.forEach((z,i)=>{s+=`<polyline fill="none" stroke="${z.color||'#245344'}" stroke-width="${z.width||3}" stroke-dasharray="${dashes[i%3]}" points="${z.values.map((v,j)=>`${x(z.xs?z.xs[j]:j)},${y(v)}`).join(' ')}"/>`});
  if(point)s+=`<circle cx="${x(point[0])}" cy="${y(point[1])}" r="6" fill="#fffefa" stroke="#203c35" stroke-width="3"/>`;
  s+='</svg><p class="note">'+series.map((z,i)=>`${escapeHTML(z.name||'Bestand')}: ${lineNames[i%3]}`).join(' · ')+(ref!==null?' · K: korte streker, vannrett':'')+'</p>';
  let indices=series[0].values.map((_,i)=>i);
  if(tableXs)indices=indices.filter(i=>tableXs.includes(series[0].xs?series[0].xs[i]:i));
  const headers=[xLabel,...series.map(z=>(z.name||'Bestand')+' ('+yLabel.toLowerCase()+')'),...(ref!==null?['K (dyr)']:[])];
  const rows=indices.map(i=>[decimal(series[0].xs?series[0].xs[i]:i),...series.map(z=>decimal(z.values[i])),...(ref!==null?[decimal(ref)]:[])]);
  s+=`<details ${wasOpen?'open':''}><summary>Se tallene som tabell</summary>${dataTable('Modellverdier · '+xLabel+' og '+yLabel,headers,rows)}<p class="small">Visningen avrundes til høyst to desimaler. Beregningene bruker uavrundede verdier.</p></details>`;
  el.innerHTML=s;
}
function lab(ids,fn){ids.forEach(id=>{const el=$('#'+id);if(state.lab[id]!==undefined){if(el.type==='checkbox')el.checked=!!state.lab[id];else el.value=state.lab[id]}el.addEventListener('input',()=>{state.lab[id]=el.type==='checkbox'?el.checked:el.value;save();fn()})});modelRenderers.push(fn);fn()}

  });
  if($('#adultShare'))lab(['adultShare'],()=>{
    const a=+$('#adultShare').value,c=100-a,ad=.9*a,ca=.6*c,newc=.3*a;
    $('#adultShareOut').textContent=`${a} voksne / ${c} kalver`;
    $('#ageBar').innerHTML=`<span style="width:${a}%"></span><span style="width:${c}%"></span>`;
    $('#ageBar').setAttribute('aria-label',`Startfordeling av 100 hunndyr: ${a} voksne og ${c} kalver`);
    $('#ageResult').innerHTML=`<div><div class="stat">${decimal(ad+ca)}</div><div class="statlabel">overlevende fra start</div></div><div><div class="stat">+ ${decimal(newc)}</div><div class="statlabel">nye hunnkalver</div></div><div><div class="stat">= ${decimal(ad+ca+newc)}</div><div class="statlabel">hunndyr ved neste telling</div></div>`;
    $('#ageTable').innerHTML=dataTable('Aldersfordeling ved start og bidrag til neste telling',['Størrelse','Antall hunndyr'],[['Voksne ved start',a],['Kalver ved start',c],['Overlevende voksne',decimal(ad)],['Overlevende kalver',decimal(ca)],['Nye hunnkalver som lever ved neste telling',decimal(newc)],['Total ved neste telling',decimal(ad+ca+newc)]]);
    rememberModel('age',`${a} voksne + ${c} kalver`,[['Voksne ved start',a],['Kalver ved start',c],['Overlevelse voksne / kalver','0,90 / 0,60'],['Nye hunnkalver per voksen ved start','0,30'],['Tid','Ett år']],[['Overlevende fra start',decimal(ad+ca)],['Nye hunnkalver',decimal(newc)],['Totalt neste år',decimal(ad+ca+newc)]]);
  });
  if($('#preyN'))lab(['preyN','predN','responseType'],()=>{
    const n=+$('#preyN').value,p=+$('#predN').value,t=+$('#responseType').value;
    const f2=n=>12*n/(200+n),f3=n=>12*n*n/(40000+n*n),f=t===2?f2:f3;
    $('#preyNOut').textContent=n+' dyr';$('#predNOut').textContent=p;
    const xs=Array.from({length:101},(_,i)=>i*10);
    chart('#predChart',[{values:xs.map(f2),xs,width:t===2?4:2.5,name:'Type II'},{values:xs.map(f3),xs,color:'#a74f2a',width:t===3?4:2.5,name:'Type III'}],{xMax:1000,yMax:12,xLabel:'Byttedyr i området',yLabel:'Byttedyr per rovdyr per måned',point:[n,f(n)],tableXs:[0,50,100,200,400,800,1000,n],description:`Teoretisk konsum per rovdyr: type II flater ut, type III er S-formet. Punktet viser valgt type ${t===2?'II':'III'} ved ${n} byttedyr: ${decimal(f(n))} byttedyr per rovdyr per måned.`});
    $('#predResult').innerHTML=`<div><div class="stat">${decimal(f(n))}</div><div class="statlabel">byttedyr per rovdyr per måned</div></div><div><div class="stat">${decimal(p*f(n))}</div><div class="statlabel">byttedyr tatt totalt per måned</div></div><div><div class="stat">${decimal(p*f(n)/n*100)} %</div><div class="statlabel">av byttedyrbestanden per måned</div></div>`;
    $('#predSelection').textContent=`Valgt: type ${t===2?'II (heltrukket)':'III (streket)'}. Den tykkeste kurven og punktet viser beregningen i resultatfeltene.`;
    $('#predExplanation').textContent=`Hvert rovdyr: ${decimal(f(n))} byttedyr per måned. ${p} rovdyr × ${decimal(f(n))} = ${decimal(p*f(n))} totalt per måned. Det tilsvarer ${decimal(p*f(n)/n*100)} % av ${n}. Flere rovdyr endrer totaluttaket; kurven per rovdyr ligger fast.`;
    rememberModel('pred',`Type ${t===2?'II':'III'} · ${n} byttedyr · ${p} rovdyr`,[['Respons','Type '+(t===2?'II':'III')],['Byttedyr i fast område',n],['Rovdyr',p],['Tid','Én måned, øyeblikksberegning']],[['Konsum per rovdyr per måned',decimal(f(n))],['Totaluttak per måned',decimal(p*f(n))],['Andel tatt per måned',decimal(p*f(n)/n*100)+' %']]);
  });
  if($('#quota'))lab(['quota'],()=>{
    const q=+$('#quota').value;$('#quotaOut').textContent=q+' dyr per år';
    const rates=[.95,1.1,1.2],colors=['#a74f2a','#245344','#326986'];
    const s=rates.map((r,i)=>{let v=[240];for(let t=0;t<5;t++)v.push(Math.max(0,v.at(-1)*r-q));return{values:v,color:colors[i],name:'λ = '+decimal(r)}});
    const summary=`Etter fem år: omtrent ${fmt(s[0].values[5])} dyr ved λ = 0,95, ${fmt(s[1].values[5])} ved λ = 1,10 og ${fmt(s[2].values[5])} ved λ = 1,20. Årlig uttak: ${q} dyr.`;
    chart('#quotaChart',s,{xMax:5,yMax:650,description:summary});
    $('#quotaResult').textContent=q===0?'Selv uten jakt går bestanden ned ved λ = 0,95. Modellen sier ikke hvor sannsynlig dette scenarioet er.':'Et fast uttak blir en større andel når bestanden minker. Lavere uttak reduserer jaktens bidrag, men garanterer ikke vekst.';
    rememberModel('quota',`Uttak ${q} dyr per år`,[['Startbestand','240 dyr'],['Årlig uttak',q+' dyr'],['Faste vekstfaktorer','0,95 / 1,10 / 1,20'],['Tid','5 år']],[...rates.map((r,i)=>['År 5 ved λ = '+decimal(r),decimal(s[i].values[5])+' dyr']),['Tolkning','Deterministiske scenarioer; ingen sannsynligheter beregnes.']]);
  });
  if($('#detectionP'))lab(['detectionP'],()=>{
    const p=+$('#detectionP').value,n=200,c=n*p/100;
    $('#detectionPOut').textContent=p+' %';$('#detectionBar').style.width=p+'%';
    $('#detectionResult').innerHTML=`Faktisk bestand: <strong>200 dyr</strong>. Forventet observert antall: <strong>${fmt(c)} dyr</strong> ved ${p} % oppdagbarhet.`;
    $('#detectionTable').innerHTML=dataTable('Forventede observasjoner i en uendret bestand',['Oppdagbarhet','Faktisk antall','Forventet observert'],[['60 %',200,120],['80 %',200,160],['Ditt valg: '+p+' %',n,c]]);
  });
  for(const id of Object.keys(currentModels))renderSnapshots(id);
}

function fieldbookText(){
 const lines=['BESTAND I BEVEGELSE – MIN FELTBOK','Versjon 1.7.1 · '+new Date().toLocaleDateString('nb-NO'),`${groups.flat().filter(done).length} av ${total} kjerneoppgaver løst`,'Modeller og tall er konstruerte øvingsdata. Egne refleksjoner er ikke automatisk vurdert.',''];
 for(let station=1;station<=7;station++){
   lines.push('STASJON '+station+' – '+titles[station].toUpperCase(),'');
   for(const id of groups[station]){const q=Q[id],a=state.answers[id];lines.push(q.title,a?`Siste svar: ${q.type==='number'?a.value+' dyr':q.options[a.value]}`:'Ikke besvart',a?'Tilbakemelding: '+a.text:'',a?`Mestring nå eller tidligere: ${a.correct?'ja':'nei'} · Forsøk: ${a.attempts}`:'','')}
   for(const [id,m] of Object.entries(MODEL_META)){
     if(m.station!==station)continue;
     const list=(state.experiments[id]||[]).filter(trialHasWork);
     lines.push('MODELLVERKSTED '+m.number+' – '+m.title);
     if(!list.length)lines.push('(Ingen dokumenterte forsøk)');
     for(const t of list){lines.push('Forsøk '+t.number+' ['+t.id+']','Forutsi: '+(t.prediction||'(Ikke skrevet)'), '');
       t.snapshots.forEach((s,i)=>{lines.push('  Resultat '+(i+1)+' – '+s.short,'  PARAMETERE',...s.params.map(([k,v])=>'  '+k+': '+v),'  MODELLRESULTATER',...s.results.map(([k,v])=>'  '+k+': '+v),'')});
       if(!t.snapshots.length)lines.push('(Ingen resultater tatt vare på)');
       lines.push('Observer: '+(t.observation||'(Ikke skrevet)'),'Forklar: '+(t.explanation||'(Ikke skrevet)'),'Modellens grenser: '+(t.limits||'(Ikke skrevet, valgfritt)'),'');
     }
   }
   const extras=[...(station<=6?['fjellvik-'+station]:[]),...(station===6?['pit']:station===7?['detection']:[])];
   extras.forEach(k=>{if(state.notes[k])lines.push(NOTE_LABELS[k],state.notes[k],'')});
 }
 lines.push('MITT FORVALTNINGSNOTAT','');ADVICE_KEYS.forEach(k=>lines.push(NOTE_LABELS[k],state.notes[k]||'(Ikke skrevet)',''));
 if(state.notes.advice)lines.push(NOTE_LABELS.advice,state.notes.advice,'');
 lines.push(`Egenvurdering: ${state.checks.length} av 4 kjennetegn krysset av.`, 'Valgte punkter: '+state.checks.map(i=>i+1).join(', '),'',NOTE_LABELS.reflection,state.notes.reflection||'(Ikke skrevet)','');
 const previousExit=LEGACY_EXIT_QUESTIONS.filter(([id])=>(state.notes[id]||'').trim());if(previousExit.length){lines.push('BEVARTE SVAR FRA TIDLIGERE VERSJON – UTGÅTT SLUTTOPPGAVE',LEGACY_EXIT_CASE,'');previousExit.forEach(([id,label])=>lines.push(label,state.notes[id],''));}
 if(state.legacyAnswers.length){lines.push('TIDLIGERE OPPGAVER – SVAR BEVART FRA FØR REVISJONEN','Disse svarene teller ikke i fremdriften for de reviderte oppgavene.','');state.legacyAnswers.forEach(a=>lines.push(a.title,'Svar: '+a.response,'Tilbakemelding: '+(a.text||''),'Forsøk: '+(a.attempts||0),''))}
 for(const [k,v] of Object.entries(state.notes)){if(!NOTE_LABELS[k])lines.push('Annet bevart notat: '+k,v,'')}
 return lines.join('\n');
}
function exportNotes(){const blob=new Blob([fieldbookText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='min-feltbok-bestandsdynamikk.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$('#exportStatus').textContent='Feltboken er klargjort for nedlasting. Se nettleserens nedlastinger.'}

let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>modelRenderers.forEach(fn=>fn()),150)});
let printOpened=[];window.addEventListener('beforeprint',()=>{printOpened=[...document.querySelectorAll('#content details:not([open])')];printOpened.forEach(el=>el.open=true)});window.addEventListener('afterprint',()=>{printOpened.forEach(el=>el.open=false);printOpened=[]});
function reset(){if(confirm('Vil du slette alle svar, notater, modellforsøk og innstillinger i denne nettleseren og starte på nytt?')){state={revision:3,route:'session',exitRevealed:false,page:0,answers:{},notes:{},checks:[],lab:{},experiments:{},legacyAnswers:[]};save();go(0)}}$('#reset').onclick=reset;
go(state.page,false);
</script></body></html>
